name: restore-plugin-index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-medicine-support-hub-clean
      - name: Restore plugin-index.json
        run: |
          python3 - <<'PY'
          import base64, gzip, pathlib
          parts = sorted(pathlib.Path('.github').glob('restore-plugin-index.b64.part*'))
          assert parts, 'missing payload parts'
          b64 = ''.join(p.read_text().strip() for p in parts)
          data = gzip.decompress(base64.b64decode(b64))
          pathlib.Path('.grok-plugin/plugin-index.json').write_bytes(data)
          print('wrote', len(data))
          PY
      - name: Commit and push
        run: |
          git config user.name "minasami"
          git config user.email "minasami@users.noreply.github.com"
          git add .grok-plugin/plugin-index.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "fix: restore full plugin-index and marketplace for medicine-support-hub"
          git push origin HEAD:add-medicine-support-hub-clean
